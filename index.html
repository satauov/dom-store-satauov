<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Store - Максат Сатауов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Управление товарами (Store)</h1>
    
    <div class="card form-card">
      <h2>Добавить товар</h2>
      <form id="add-form">
        <div class="input-group">
          <input type="text" id="item-name" placeholder="Название товара">
          <span class="error-msg" id="name-error"></span>
        </div>
        <div class="input-group">
          <input type="number" id="item-price" placeholder="Цена (₸)">
          <span class="error-msg" id="price-error"></span>
        </div>
        <div class="input-group">
          <input type="number" id="item-qty" placeholder="Количество">
          <span class="error-msg" id="qty-error"></span>
        </div>
        <button type="submit" class="btn btn-add">Добавить в список</button>
      </form>
    </div>

    <div class="card list-card">
      <h2>Список товаров</h2>
      <table>
        <thead>
          <tr>
            <th>Название</th>
            <th>Цена</th>
            <th>Кол-во</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="store-list">
          <!-- Товары будут рендериться здесь через JS -->
        </tbody>
      </table>
      
      <div class="total-section">
        <h3>Итоговая сумма: <span id="total-price">0</span> ₸</h3>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
